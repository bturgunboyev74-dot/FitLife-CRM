name: fitlife_crm
description: "FitLife CRM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Storage
  path_provider: ^2.1.5
  file_picker: ^10.3.2

  # Images
  image_picker: ^1.1.2
  image: ^4.2.0

  # Network
  http: ^1.2.2

  # Charts
  fl_chart: ^1.0.0

  # App Info
  package_info_plus: ^8.3.0

  # URL Launcher
  url_launcher: ^6.3.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4

  # Excel
  excel: ^3.0.0
  open_file: ^3.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png